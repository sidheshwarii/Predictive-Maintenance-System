<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predictive Maintenance System — Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171A; --panel: #1D2226; --border: #2C3238;
    --text: #ECEEEF; --text-dim: #8B9298; --accent: #F2B705;
    --green: #3FB878; --red: #E24B4B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .panel {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-top: 3px solid var(--accent);
    padding: 36px 32px; border-radius: 2px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  label {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-dim); margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; background: #14171A; border: 1px solid var(--border);
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    padding: 10px 12px; border-radius: 2px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .submit-btn {
    width: 100%; margin-top: 24px; background: var(--accent); border: none;
    color: #14171A; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 14px; padding: 11px; border-radius: 2px; cursor: pointer;
  }
  .submit-btn:hover { opacity: 0.9; }
  .links { margin-top: 16px; font-size: 12px; text-align: center; }
  a { color: var(--text-dim); text-decoration: none; }
  a:hover { color: var(--accent); }
  .error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; font-family: 'IBM Plex Mono', monospace; }
  .result {
    margin-top: 18px; padding: 12px; border: 1px dashed var(--border);
    border-radius: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--text-dim); display: none; word-break: break-all;
  }
  .result a { color: var(--accent); }
  .note { font-size: 11px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<div class="panel">
  <h1>Forgot Password</h1>
  <div class="sub">Enter your username or email and we'll send a reset link</div>

  <form id="forgotForm">
    <label>Username or Email</label>
    <input type="text" id="identifier" required>

    <button type="submit" class="submit-btn">Send Reset Link</button>
    <div class="error" id="errorMsg"></div>
  </form>

  <div class="result" id="resultBox">
    <div id="resultText"></div>
    <div class="note">This project doesn't have a real email server configured, so the reset link is shown directly here instead of being emailed — click it to continue.</div>
  </div>

  <div class="links"><a href="login.html">Back to sign in</a></div>
</div>

<script>
const API_URL = "http://localhost:8000";

document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const identifier = document.getElementById("identifier").value.trim();
  const errorEl = document.getElementById("errorMsg");
  const resultBox = document.getElementById("resultBox");
  const resultText = document.getElementById("resultText");
  errorEl.style.display = "none";
  resultBox.style.display = "none";

  try {
    const res = await fetch(`${API_URL}/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username_or_email: identifier }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed.");

    if (data.reset_token) {
      const link = `reset-password.html?token=${encodeURIComponent(data.reset_token)}`;
      resultText.innerHTML = `<a href="${link}">Click here to reset your password</a>`;
    } else {
      resultText.textContent = data.message;
    }
    resultBox.style.display = "block";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
  }
});
</script>
</body>
</html>
